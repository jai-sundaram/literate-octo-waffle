services:
  meridian-db:
    image: postgres:15
    environment:
      POSTGRES_DB: meridian
      POSTGRES_USER: meridian
      POSTGRES_PASSWORD: meridian
    ports:
      - "5432:5432"
  app:
    build: .
    depends_on:
      - meridian-db
    environment:
      DB_HOST: meridian-db
      DB_USER: meridian
      DB_PASSWORD: meridian
    ports:
      - "8080:8080"
